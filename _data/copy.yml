# ==========================================================================
# copy.yml — toda palavra que o site diz.
#
# ESTE ARQUIVO É UM ESPELHO, NÃO A FONTE.
# A fonte é o deck de copy do projeto no DigitalOffice
# (2_casa/duminguz/nacional/2026-site/copia.md — marca da casa: o João
# aprova, o Yargo revisa; decisoes/0006). Uma palavra
# errada é corrigida lá primeiro, depois copiada para cá.
#
# Todo trecho é { text, status }. A situação viaja junto com o texto, para o
# build saber o que foi aprovado:
#
#   ok       aprovado pelo cliente — pode ir ao ar
#   pick     candidato — alguém tem uma escolha a fazer
#   draft    rascunho, NUNCA vai ao ar sem aprovação
#   missing  ainda sem texto — a seção vai ao ar SEM o trecho, nunca com
#            placeholder ou "em breve"
#
# O /proto/ mostra as marcas (show_status: true). As páginas reais mostram só
# trechos `ok`.
# ==========================================================================

# --- Em toda página --------------------------------------------------------
shared:
  nav:
    items:
      - { label: "Trabalhos",     url: "#trabalhos" }
      - { label: "Como funciona", url: "#como-funciona" }
      - { label: "Perguntas",     url: "#perguntas" }
      - { label: "Contato",       url: "#contato" }
    status: draft
  footer:
    line:
      text: "João Duminguz - Design de marca, site e redes · João Pessoa, Paraíba"
      status: draft

# --- Título e descrição por página (o copy_key de cada página escolhe) -----
meta:
  home:
    title:       { text: "João Duminguz - Design de marca, site e redes", status: draft }
    description: { text: "Designer em João Pessoa, atendendo o Brasil inteiro. Marca, site e redes sociais pensados como um sistema só. Orçamento pelo WhatsApp.", status: draft }
    share:       { src: "", status: missing }

  design:
    title:       { text: "Design de marca, posts e site - João Duminguz", status: draft }
    description: { text: "Logo, identidade visual, posts e site, desenhados juntos para o seu negócio ser reconhecido em qualquer lugar. Arquivos-fonte e guia de uso em toda entrega.", status: draft }
    share:       { src: "", status: missing }

# --- Home ------------------------------------------------------------------
# A ordem das seções é a do deck (copia.md, "A página, de cima para baixo").
home:
  hero:
    menu:      { text: "Início", status: draft }
    titulo:    { text: "Feito à mão, pensado como sistema.", status: ok }
    subtitulo: { text: "Marca, site, vídeo e 3D para o seu negócio. Sou João Duminguz, designer e artista em João Pessoa, e desenho tudo isso como uma coisa só.", status: draft }
    cta:       { text: "Pedir orçamento pelo WhatsApp", url: "#contato", status: draft }
    provas:
      - { text: "14 anos de design, desde 2012", status: draft }
      - { text: "Um design system mantido por dez anos numa empresa de tecnologia", status: draft }
      - { text: "Atendo o Brasil inteiro", status: draft }

  servicos:
    frase:  { text: "Uma marca. Quatro jeitos de aparecer.", status: draft }
    titulo: { text: "O que eu faço", status: draft }
    itens:
      - nome:  { text: "Marca", status: draft }
        texto: { text: "Logotipo, cores, tipografia e o manual que diz como usar tudo isso. Para negócio novo ou para marca que precisa de uma atualização sem perder o que já é seu.", status: draft }
      - nome:  { text: "Site", status: draft }
        texto: { text: "Landing page ou site institucional, desenhado e construído por mim, com o contato direto no WhatsApp.", status: draft }
      - nome:  { text: "Redes sociais e motion", status: draft }
        texto: { text: "Posts, vídeos curtos e animação do logo, feitos a partir da marca para o feed ficar com cara de um negócio só.", status: draft }
      - nome:  { text: "Vídeo e 3D", status: draft }
        texto: { text: "Render de produto, motion graphic e animação no Blender e no After Effects, para anúncio, rede social e site.", status: draft }
    tambem: { text: "Também faço design de interface e de aplicativo, apresentações e pitch decks, ilustração 2D e 3D para marcas, e impressos como rótulo e cardápio.", status: draft }

  trabalhos:
    frase:  { text: "Do rótulo de cerveja ao jogo.", status: draft }
    titulo: { text: "Trabalhos", status: draft }
    itens:
      - id: redcred
        nome:  { text: "RedCred - Marca e marketing", status: draft }
        texto: { text: "Uma empresa de soluções financeiras precisava de marca e de marketing. Criei a marca, organizei os processos internos, montei o time de marketing e dirigi a arte das campanhas, de 2020 a 2021.", status: draft }
      - id: paofrances
        nome:  { text: "Pão Francês da Serra - Redesenho de marca", status: draft }
        texto: { text: "Uma padaria de família, com uma marca que a dona conhecia de cor. Redesenhei o logo sem tirar dela o que ela reconhecia, e entreguei junto o manual da marca e um kit de ilustrações para embalagens e redes.", status: draft }
      - id: facil
        nome:  { text: "Fácil Soluções - Design de interface", status: draft }
        texto: { text: "Desenhei o design system e a arquitetura de interface do produto de uma empresa de tecnologia com certificação ISO 9001. O sistema foi mantido por dez anos enquanto o produto crescia.", status: draft }
      - id: nike
        nome:  { text: "Proposta para a Nike - Motion 3D", status: draft }
        texto: { text: "Na Sortium, uma equipe de três fez um vídeo para propor uma parceria à Nike, que recebeu bem o material. Fiz sozinho a abertura, em Blender, e animei um personagem. O resto do vídeo é do Cacio, e o storyboard, de um colega da equipe.", status: draft }
      - id: cosmogene
        nome:  { text: "Cosmogene - Design system e motion", status: draft }
        texto: { text: "Num jogo da Sortium, defini o sistema visual inteiro: design system, interface, ícones e arte conceitual. E animei no After Effects os vídeos de divulgação do jogo.", status: draft }
    mais:
      titulo: { text: "Mais marcas", status: draft }
      texto:  { text: "Logotipos e identidades para negócios reais, e o logo e o rótulo da cerveja artesanal Maledita.", status: draft }

  passos:
    frase:  { text: "Quatro passos, e você fala comigo em todos.", status: draft }
    titulo: { text: "Como funciona", status: draft }
    itens:
      - nome:  { text: "Conversa", status: draft }
        texto: { text: "Você me conta pelo WhatsApp o que o seu negócio faz e o que precisa.", status: draft }
      - nome:  { text: "Orçamento", status: draft }
        texto: { text: "Mando o orçamento com o que vou entregar, o prazo e o valor.", status: draft }
      - nome:  { text: "Criação", status: draft }
        texto: { text: "Desenho, mostro, e ajustamos juntos até ficar certo.", status: draft }
      - nome:  { text: "Entrega", status: draft }
        texto: { text: "Você recebe todos os arquivos, prontos para usar, e o manual de como usar.", status: draft }

  sobre:
    frase:  { text: "Desde 2012, desenhando à mão.", status: draft }
    titulo: { text: "Quem sou", status: draft }
    texto:  { text: "Sou João Duminguz, artista digital e designer de João Pessoa, na Paraíba. Desde 2012 desenho marcas, interfaces e peças de comunicação. Passei dez anos cuidando do design de um produto de tecnologia e os últimos anos dirigindo arte para estúdios de games. O que levo de lá para o seu negócio é o hábito de pensar a marca como um sistema: cada peça nova já nasce sabendo como se encaixar nas outras.", status: draft }

  perguntas:
    frase:  { text: "Antes de você perguntar.", status: draft }
    titulo: { text: "Perguntas frequentes", status: draft }
    itens:
      - pergunta: { text: "Quanto custa?", status: draft }
        resposta: { text: "Depende do que o seu negócio precisa: uma marca nova, um site, ou os dois. Me conta pelo WhatsApp e eu mando o orçamento com o valor e o prazo.", status: draft }
      - pergunta: { text: "Você atende fora de João Pessoa?", status: draft }
        resposta: { text: "Sim. Atendo o Brasil inteiro, pelo WhatsApp e por videochamada.", status: draft }
      - pergunta: { text: "Quem faz o trabalho?", status: draft }
        resposta: { text: "Eu, e você fala direto comigo do primeiro contato à entrega. Quando o projeto pede marketing, como anúncios e gestão das redes, trabalho junto com um parceiro de marketing.", status: draft }
      - pergunta: { text: "Já tenho um logo. Precisa jogar fora?", status: draft }
        resposta: { text: "Não. Muitas vezes o melhor é redesenhar mantendo o que o seu cliente já reconhece, como fiz na Pão Francês da Serra.", status: draft }
      - pergunta: { text: "O que eu recebo no final?", status: draft }
        resposta: { text: "Os arquivos em todos os formatos de que você precisa, para imprimir e para usar no digital, e o manual da marca.", status: draft }
      - pergunta: { text: "Quanto tempo leva?", status: draft }
        resposta: { text: "Depende do tamanho do projeto. O prazo vem escrito no orçamento, antes de começar.", status: draft }

  contato:
    frase:  { text: "Me conta o que o seu negócio faz.", status: draft }
    titulo: { text: "Contato", status: draft }
    texto:  { text: "Me manda uma mensagem no WhatsApp. Respondo eu mesmo.", status: draft }
    cta:    { text: "Abrir o WhatsApp", status: draft }

